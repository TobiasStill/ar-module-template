<!--
  MESH-RENDER-ORDER + UNLIT-MATERIAL — both components on one model
  ==================================================================
  Not compiled or served by anything in this project. Read
  MESH-RENDER-ORDER-FEATURE-GUIDE.md and LOD-BILLBOARD-FEATURE-GUIDE.md's
  unlit-material section first for what each attribute does.

  SETUP: copy examples/assets/mesh-render-order-demo.glb into src/assets/,
  then paste the markup below inside `scene-root` in src/ArModule.vue.

  THE MODEL is generated by scripts/generate-demo-assets.ts: five overlapping
  see-through panels whose meshes are named veil_back, veil_middle, veil_front,
  halo and core. For your own model use the names as they arrive at runtime:
  GLTFLoader turns a space in a name into an underscore. Change the numbers
  below to see the stacking change (open devtools and call
  el.setAttribute('mesh-render-order', '...') on the entity).

  keepShadowBehavior: true keeps the `shadow` component working as authored.
  Without it unlit-material switches shadows off, the right default for its
  usual LOD-billboard use.

  alphaTest stays unset because these panels are see-through by alpha. A model
  with cut-out textures would use e.g. alphaTest: 0.5.
-->

<a-entity
    gltf-model="#mesh-render-order-demo"
    unlit-material="keepShadowBehavior: true"
    mesh-render-order="
      veil_back: 1;
      veil_middle: 2;
      veil_front: 3;
      halo: 4;
      core: 5;
    "
    no-frustum-cull
    position="0 0 0"
    shadow>
</a-entity>
